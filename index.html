<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator with History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display" id="display">0</div>
            <div class="buttons">
                <button class="btn btn-clear" onclick="calculator.clear()">C</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('/')">/</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('*')">*</button>
                <button class="btn btn-delete" onclick="calculator.delete()">DEL</button>

                <button class="btn" onclick="calculator.appendNumber('7')">7</button>
                <button class="btn" onclick="calculator.appendNumber('8')">8</button>
                <button class="btn" onclick="calculator.appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('-')">-</button>

                <button class="btn" onclick="calculator.appendNumber('4')">4</button>
                <button class="btn" onclick="calculator.appendNumber('5')">5</button>
                <button class="btn" onclick="calculator.appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('+')">+</button>

                <button class="btn" onclick="calculator.appendNumber('1')">1</button>
                <button class="btn" onclick="calculator.appendNumber('2')">2</button>
                <button class="btn" onclick="calculator.appendNumber('3')">3</button>
                <button class="btn btn-equals" onclick="calculator.calculate()" style="grid-row: span 2;">=</button>

                <button class="btn" onclick="calculator.appendNumber('0')" style="grid-column: span 2;">0</button>
                <button class="btn" onclick="calculator.appendNumber('.')">.</button>
            </div>
            <button class="btn btn-history" onclick="calculator.toggleHistory()">History</button>
        </div>

        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h2>Calculation History</h2>
                <button class="btn-close" onclick="calculator.toggleHistory()">×</button>
            </div>
            <div class="history-list" id="historyList">
                <p class="no-history">No calculations yet</p>
            </div>
            <button class="btn btn-clear-history" onclick="calculator.clearHistory()">Clear History</button>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
